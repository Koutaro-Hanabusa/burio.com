name: CI

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Void Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24.21.0"
          cache: true
          run-install: true
      - name: Prepare Void types and type check
        run: vp run check-types
      - name: Check
        run: vp check
      - name: Test
        run: vp test run
      - name: Build
        env:
          ADMIN_TOKEN_SECRET: ci-only-test-secret-at-least-32-bytes
          WRANGLER_LOG_PATH: /tmp/burio-wrangler-logs
        run: vp run build
